name: Release

# Cut a release when a version tag is pushed. Builds the sdist + wheel,
# generates a software bill of materials (SBOM), and publishes both as
# GitHub release assets. The SBOM gives downstream consumers a verifiable
# dependency inventory and is one of the supply-chain artifacts OpenSSF
# Scorecard looks for.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Build, SBOM, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub release
      id-token: write # required for cosign keyless signing via Sigstore OIDC
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Build sdist and wheel
        run: uv build

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # Scan the source tree so syft picks up uv.lock + pyproject.toml
          # and records the full locked dependency set.
          path: .
          format: spdx-json
          artifact-name: llm-reviewer-sbom.spdx.json
          output-file: dist/llm-reviewer-sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign release artifacts with cosign
        # Keyless signing via Sigstore + GitHub OIDC. Produces .sig + .pem
        # for each artifact so downstream consumers can verify provenance
        # with `cosign verify-blob` and the repo's workflow identity.
        run: |
          for artifact in dist/*.whl dist/*.tar.gz dist/llm-reviewer-sbom.spdx.json; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "${artifact}"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/llm-reviewer-sbom.spdx.json
            dist/*.sig
            dist/*.pem
          generate_release_notes: true
          fail_on_unmatched_files: true
