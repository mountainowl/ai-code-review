gitlab_url = "https://gitlab.com"
dry_run = false
post_summary = false
max_reviews_per_run = 8
max_findings_per_review = 8
review_timeout_seconds = 1800

[secrets]
gitlab_token = ""
openai_api_key = ""
anthropic_api_key = ""

[runtime]
base_dir = "var"
prompt = "prompts/00-meta.md"
review_model = "gpt-5.5"
review_reasoning_effort = "medium"
review_dry_run = true
poll_interval_seconds = 900
codex_review_profile = "llm-reviewer"
codex_sandbox = "read-only"
gitlab_api_url = "https://gitlab.com/api/v4"
gitlab_denied_tools_regex = "^(delete_.*|merge_merge_request|push_files)$"

[telemetry]
enabled = false
service_name = "llm-reviewer"
environment = "prod"
otlp_endpoint = "http://127.0.0.1:4317"
otlp_protocol = "grpc"
export_interval_seconds = 30
emit_finding_events = true
emit_outcome_sync = true

[telemetry.pricing.default]
input_per_1m = 0.0
output_per_1m = 0.0
cached_input_per_1m = 0.0

[[projects]]
path = "example/enabled-repo"
enabled = true

[[projects]]
path = "example/disabled-repo"
enabled = false
