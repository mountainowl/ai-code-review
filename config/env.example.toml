# Copy this file to config/env.toml and edit it there.
# Keep config/env.toml private because it contains tokens.

[gitlab]
# GitLab web URL used by the poller to find merge requests.
# Change this only for self-hosted GitLab; it also acts as the default base for api_url.
url = "https://gitlab.com"

# GitLab API URL used by GitLab MCP tools inside the review agent.
# Keep it on the same GitLab host as url or the agent may fetch/post against a different server.
api_url = "https://gitlab.com/api/v4"

# GitLab username of the bot account that posts review comments.
# Outcome sync uses this to tell bot comments apart from developer replies.
bot_username = "llm-reviewer"

# Safety fence for GitLab MCP tools available to the review agent.
# These tools stay blocked even if the agent prompt or MCP server exposes them.
denied_tools_regex = "^(delete_.*|merge_merge_request|push_files)$"

[review]
# When true, reviews are planned and stored but no GitLab comments are posted.
# Start with true; switch to false only after test reviews look right.
dry_run = true

# Maximum merge requests queued by one poll cycle.
# Higher values increase throughput but can fork more review workers at once.
max_merge_requests_per_poll = 8

# Maximum findings accepted from one merge request review.
# This value is also rendered into the meta prompt as {{MAX_FINDINGS_PER_REVIEW}}.
max_findings_per_merge_request = 8

# Maximum seconds one review worker can run before it is killed.
# Increase this for very large merge requests or slower models.
timeout_seconds = 1800

[poller]
# Runtime state directory under the install root.
# SQLite state, worktrees, logs, reports, and rendered prompts are written here.
state_dir = "var"

# Suggested wait time between poller runs for long-running wrappers.
# Cron/systemd schedules can use a different interval; this mostly feeds helper scripts.
interval_seconds = 900

# Uncomment to temporarily review only one MR IID across enabled projects.
# Leave unset in production so the poller can process every eligible MR.
# target_merge_request_iid = 123

[agent]
# Meta prompt file used for every review.
# max_findings_per_merge_request is substituted into this file before the agent runs.
prompt_file = "prompts/00-meta.md"

# Model name passed to the review CLI wrapper.
# Keep pricing below in sync if you want estimated cost metrics to be meaningful.
model = "gpt-5.5"

# Reasoning effort passed to the review CLI wrapper.
# Higher values can improve review quality but usually increase latency and cost.
reasoning_effort = "medium"

# Dry-run flag exported to manual review wrappers.
# This is separate from review.dry_run, which controls whether the poller posts comments.
manual_review_dry_run = true

# Codex profile used by the Codex wrapper.
# The profile should include the code-review skill and required MCP/plugin setup.
codex_profile = "llm-reviewer"

# Filesystem sandbox passed to Codex review runs.
# read-only lets the reviewer inspect code without modifying the checkout.
codex_sandbox = "read-only"

[secrets]
# GitLab token for reading MRs and posting review threads.
# Needs api scope; exported as GITLAB_TOKEN and GITLAB_PERSONAL_ACCESS_TOKEN.
gitlab_token = ""

# OpenAI key used by Codex-backed review runs.
# Leave empty when using only a non-OpenAI backend.
openai_api_key = ""

# Anthropic key used by Claude-backed review runs.
# Leave empty when using only a non-Anthropic backend.
anthropic_api_key = ""

# Optional Qwen provider key for future/custom wrappers.
# The current default Codex wrapper does not require it.
qwen_api_key = ""

[telemetry]
# Enables OpenTelemetry metrics and spans.
# When false, review state still goes to SQLite but no OTel data is exported.
enabled = false

# Service name shown in your OTel backend.
# Use the same value across hosts if you want one combined service view.
service_name = "llm-reviewer"

# Environment label attached to telemetry.
# Use values like dev, staging, or prod to split dashboards.
environment = "prod"

# OTLP collector endpoint for metrics and traces.
# Ignored when telemetry.enabled is false.
otlp_endpoint = "http://127.0.0.1:4317"

# OTLP protocol.
# Only grpc is supported by this package today.
otlp_protocol = "grpc"

# How often metrics are exported to the collector.
# Lower values give fresher dashboards; higher values reduce exporter overhead.
export_interval_seconds = 30

# Emits metrics for finding lifecycle events such as planned, posted, skipped, and resolved.
# Disable only if finding-level telemetry is too noisy for your backend.
emit_finding_events = true

# Emits metrics when outcome sync checks whether posted findings were resolved or disputed.
# Disable only if you do not run outcome sync.
emit_outcome_sync = true

[telemetry.pricing.default]
# Estimated input-token price per one million tokens.
# Used only for cost metrics; it does not affect review execution.
input_per_1m = 0.0

# Estimated output-token price per one million tokens.
# Used only for cost metrics; it does not affect review execution.
output_per_1m = 0.0

# Estimated cached-input-token price per one million tokens.
# Set this if your model/backend reports cached tokens and bills them differently.
cached_input_per_1m = 0.0

[[projects]]
# GitLab project path to poll.
# Use group/repo syntax; add one block per repository.
path = "example/enabled-repo"

# Enables polling for this project.
# Set false to keep the project in config without reviewing it.
enabled = true

[[projects]]
# Example disabled project.
# This shows the shape without causing the poller to review it.
path = "example/disabled-repo"

# Disabled projects are ignored by the poller.
enabled = false
